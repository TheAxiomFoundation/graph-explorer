<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orrery large index fixture</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font: 12px/1.45 system-ui, sans-serif; color: #28392f; background: #fbfbf7; }
      .large-index-fixture { height: 100dvh; display: flex; flex-direction: column; }
      .large-index-controls { flex: none; padding: 12px 16px; border-bottom: 1px solid #dfe4d8; }
      .large-index-controls p { margin: 0 0 9px; }
      .large-index-buttons { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
      .large-index-buttons button { font: inherit; color: inherit; background: #fffffc; border: 1px solid #ccd6c5; border-radius: 4px; padding: 7px 9px; cursor: pointer; }
      .large-index-buttons button:focus-visible { outline: 2px solid #45634e; outline-offset: 2px; }
      .large-index-status { display: flex; flex-wrap: wrap; gap: 4px 18px; }
      .large-index-status output { overflow-wrap: anywhere; }
      .large-index-viewer { flex: 1; min-height: 0; }
      .large-index-viewer .ge-explorer { min-height: 0; }
      .large-index-inspector { display: flex; flex-direction: column; gap: 12px; }
      .large-index-inspector code, .large-index-inspector output { overflow-wrap: anywhere; }
      @media (max-width: 760px) { .large-index-controls { padding: 8px 10px; } .large-index-buttons button { min-height: 36px; } }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./large-index.tsx"></script></body>
</html>
